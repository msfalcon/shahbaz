<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shahbaz ❤️ Mahnoor | Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;text-align:center;color:#fff;font-family:'Playfair Display',Georgia,serif;background:linear-gradient(160deg,#291039 0%,#672454 35%,#c44878 70%,#ff91ad 100%)}main{position:relative;z-index:1;width:min(100%,950px);padding:55px 20px}.big-heart{font-size:65px;animation:beat 1.8s infinite;text-shadow:0 0 25px #ff75aa}h1{font-family:'Great Vibes',cursive;font-size:clamp(48px,9vw,95px);font-weight:400;margin:20px 0;color:#fff0f5;text-shadow:0 0 20px #ff5b9d}h1 span{color:#ff8db9}.subtitle{font-size:clamp(19px,3vw,24px);letter-spacing:3px}.start-date{margin-top:15px;color:#ffe3ee;font-size:17px}.forever{font-family:'Great Vibes',cursive;font-size:46px;color:#ffd4e5;margin:15px 0 40px}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.time-box{background:linear-gradient(145deg,#ffe6ee,#ffb7ce);color:#811c48;padding:28px 8px;border-radius:24px;box-shadow:0 10px 35px #ff3b8450,0 0 20px #ffb4d060;transition:transform .3s}.time-box:hover{transform:translateY(-6px)}.time-icon{font-size:29px;margin-bottom:12px}.number{font-size:clamp(32px,5vw,60px);font-weight:600;font-variant-numeric:tabular-nums}.label{font-size:19px;margin-top:8px}.message{margin:45px auto 0;max-width:650px;padding:30px 20px;border:1px solid #ffc4d8;border-radius:28px;background:#ffffff13;backdrop-filter:blur(12px);font-size:clamp(18px,3vw,24px);line-height:1.9}.footer{margin-top:45px;font-family:'Great Vibes',cursive;font-size:35px;color:#ffe1eb}.floating-heart{position:fixed;bottom:-60px;color:#ff94be;pointer-events:none;z-index:0;animation:floatUp linear forwards}@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%,85%{opacity:.8}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}@keyframes beat{50%{transform:scale(1.15)}}@media(max-width:600px){.timer{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.time-box{padding:22px 8px}.forever{font-size:38px}.label{font-size:16px}}@media(prefers-reduced-motion:reduce){.big-heart,.floating-heart{animation:none}}
</style>
</head>
<body>
<main>
<div class="big-heart">💕</div>
<h1>Shahbaz <span>♥</span> Mahnoor</h1>
<div class="subtitle">Together Since</div>
<div class="start-date">25 September 2026 • 6:00 PM</div>
<div class="forever">and forever ♡</div>
<section class="timer" aria-label="Time together">
<div class="time-box"><div class="time-icon">♡</div><div class="number" id="days">0</div><div class="label">Days</div></div>
<div class="time-box"><div class="time-icon">◷</div><div class="number" id="hours">00</div><div class="label">Hours</div></div>
<div class="time-box"><div class="time-icon">♡</div><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
<div class="time-box"><div class="time-icon">💕</div><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
</section>
<div class="message">With you, every moment feels special.<br>Every second is another beautiful memory.<br>Together since, and forever. ♡</div>
<div class="footer">Forever yours, Shahbaz ❤️</div>
</main>
<script>
// 25 September 2026 at 6:00 PM, Germany time (CEST)
const START_DATE='2026-09-25T18:00:00+02:00';
const startTime=new Date(START_DATE).getTime();
function updateTimer(){const difference=Math.max(0,Date.now()-startTime);const total=Math.floor(difference/1000);const values=[Math.floor(total/86400),Math.floor(total%86400/3600),Math.floor(total%3600/60),total%60];['days','hours','minutes','seconds'].forEach((id,i)=>{document.getElementById(id).textContent=i===0?String(values[i]):String(values[i]).padStart(2,'0')})}
updateTimer();setInterval(updateTimer,1000);
function createHeart(){const heart=document.createElement('div');heart.className='floating-heart';heart.textContent=Math.random()>.5?'♥':'♡';heart.style.left=Math.random()*100+'vw';heart.style.fontSize=12+Math.random()*25+'px';const duration=5+Math.random()*7;heart.style.animationDuration=duration+'s';document.body.appendChild(heart);setTimeout(()=>heart.remove(),duration*1000)}
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(createHeart,600);
</script>
</body>
</html>
